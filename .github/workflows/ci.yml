name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: dnd_test_admin
          POSTGRES_DB: dnd_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_test_admin -d dnd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dnd_test_admin:ci-ephemeral-only@127.0.0.1:5432/dnd_test
      TEST_DATABASE_URL: postgresql://dnd_test_admin:ci-ephemeral-only@127.0.0.1:5432/dnd_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:apply
      - name: Installer syntax and lint
        run: |
          bash -n install.sh
          bash -n scripts/install-production.sh
          shellcheck install.sh scripts/install-production.sh
          python3 tests/installer/config.test.py
          npm run test:installer
          python3 scripts/audit-release.py
      - run: npm run typecheck
      - name: PostgreSQL security and provisioning
        run: node --test tests/security/backend.test.mjs tests/postgres/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Custom site identity
        run: npx playwright test tests/e2e/release.spec.ts --grep "site identity"
        env:
          SITE_NAME: The Dragon Table
      - run: npm run build
      - name: Production HTTP and WebSocket security
        run: node --test tests/security/transport.test.mjs
        env:
          RUN_TRANSPORT_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
