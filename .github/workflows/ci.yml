name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_USER: dnd_test_admin
          POSTGRES_DB: dnd_test
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_test_admin -d dnd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dnd_test_admin:ci-ephemeral-only@127.0.0.1:5432/dnd_test
      APP_URL: http://127.0.0.1:3100
      ASSET_DIR: /tmp/dnd-test-assets
      E2E_ADMIN_PASSWORD: ci-ephemeral-test-passphrase
      TEST_DATABASE_URL: postgresql://dnd_test_admin:ci-ephemeral-only@127.0.0.1:5432/dnd_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required artwork is included
        run: |
          git ls-files --error-unmatch -- public/assets/campaign-command-map.png
          test -s public/assets/campaign-command-map.png
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:apply
      - name: Installer syntax, lint and archive checks
        run: |
          bash -n install.sh scripts/install-production.sh
          shellcheck install.sh scripts/install-production.sh
          python3 tests/installer/config.test.py
          python3 tests/installer/archive.test.py
          npm run test:installer
          python3 scripts/audit-release.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Custom site name
        run: npx playwright test tests/e2e/identity.spec.ts
        env:
          SITE_NAME: The Dragon Table
      - run: npm run build
      - run: npm test
      - name: PostgreSQL provisioning and retries
        run: node --test tests/postgres/*.test.mjs
      - name: Production HTTP and Socket.IO security
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SERVER_COMMAND: node server.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
