name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Installer syntax and lint
        run: |
          bash -n install.sh
          bash -n scripts/install-production.sh
          shellcheck install.sh scripts/install-production.sh
          python3 tests/installer/config.test.py
          npm run test:installer
          python3 scripts/audit-release.py
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Custom site identity
        run: npx playwright test tests/e2e/release.spec.ts
        env:
          SITE_NAME: The Dragon Table
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/

  postgres:
    runs-on: ubuntu-24.04
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/postgres/*.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-ephemeral-only@127.0.0.1:5432/postgres
